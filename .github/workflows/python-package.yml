# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: "20 4 * * 0"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  COVERALLS_SERVICE_NAME: "github"

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install invoke flake8 wheel setuptools
      - name: Flake8
        run: inv flake8
      - name: Clean and build
        run: inv clean build package install
      - name: Test
        run: inv unit
      - name: Upload coverage
        # Coveralls rejects concurrent matrix uploads with 422 intermittently; don't fail the build on it
        continue-on-error: true
        run: coveralls

  upgrade:
    # Installs released versions one by one (each an upgrade over the previous),
    # then upgrades to the wheel built from this commit. After every step, import
    # the package and parse a CAP file from outside the checkout.
    #  - legacy: last 5 releases on an older runner/Python (3.9 is not published
    #    for ubuntu-latest, 26.04).
    #  - latest: latest release only, on the current runner/Python.
    name: upgrade (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: legacy
            os: ubuntu-24.04
            python-version: "3.9"
            releases: 5
            # releases pin lxml 4.5.0-4.6.3; only 4.6.3 has a 3.9 wheel, so install deps once and skip the pins
            deps: "lxml==4.6.3 python-dateutil chardet"
          - name: latest
            os: ubuntu-latest
            python-version: "3.13"
            releases: 1
            # releases pin lxml 4.x (no 3.13 wheels): install current deps, then the release without its pins
            deps: "-r src/requirements-base.txt"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel from this commit
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
      - name: Install and upgrade through the last 5 releases, then this commit
        run: |
          mkdir -p "$RUNNER_TEMP/work" && cp tests/smoke_installed.py tests/resources/australia.cap "$RUNNER_TEMP/work/"
          python -m venv "$RUNNER_TEMP/venv"
          PIP="$RUNNER_TEMP/venv/bin/pip"; PY="$RUNNER_TEMP/venv/bin/python"
          VERSIONS=$(curl -fsS https://pypi.org/pypi/capparselib/json | python -c "
          import json, sys
          from packaging.version import Version
          rel = json.load(sys.stdin)['releases']
          vs = sorted((v for v, files in rel.items() if files and not all(f.get('yanked') for f in files) and not Version(v).is_prerelease), key=Version)  # skip yanked (e.g. the broken 0.6.7)
          print(' '.join(vs[-${{ matrix.releases }}:]))")
          echo "Upgrade path: $VERSIONS <this commit>"
          "$PIP" install ${{ matrix.deps }}
          cd "$RUNNER_TEMP/work"   # outside the checkout, so ./src can't mask a broken install
          for v in $VERSIONS; do
            echo "::group::capparselib==$v"
            "$PIP" install --upgrade --no-deps "capparselib==$v"
            "$PY" smoke_installed.py australia.cap
            echo "::endgroup::"
          done
          echo "::group::this commit"
          "$PIP" install --upgrade "$RUNNER_TEMP"/dist/capparselib-*.whl
          "$PY" smoke_installed.py australia.cap
          echo "::endgroup::"

  publish:
    needs: [build, upgrade]
    # Runs on every push to master, but only does anything when setup.py carries a
    # version that has no v<version> tag yet. Bump the version and merge to release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write  # create the tag and GitHub release
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - name: Detect unreleased version
        id: ver
        run: |
          VERSION=$(sed -n 's/^ *version="\([^"]*\)".*/\1/p' setup.py | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already tagged; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.ver.outputs.new == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        if: steps.ver.outputs.new == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel invoke
      - name: Build
        if: steps.ver.outputs.new == 'true'
        run: invoke package
      - name: Publish to PyPI
        if: steps.ver.outputs.new == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
      # Tag and release only after PyPI succeeds, so a failed upload leaves nothing to clean up.
      - name: Tag and create GitHub release
        if: steps.ver.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "Release ${{ steps.ver.outputs.version }}" \
            --generate-notes
